name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']

# A new push to a PR supersedes its in-flight run. Pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Index-while-building only feeds the editor, so skip it on CI.
  BUILD_FLAGS: CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

jobs:
  test:
    name: Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the Tuist version pinned in mise.toml, keeping CI and local dev
      # in sync. Not Homebrew: the tuist tap's cask declares `conflicts_with
      # formula:`, a key Homebrew 6 dropped, which aborts any `tuist` lookup in
      # the tap. See tuist/homebrew-tuist#41.
      - name: Install Tuist
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Generate Project
        run: tuist generate --no-open

      # Only the library schemes run, so the apps, CLI and system extension
      # are never built; they only compile what their test bundles need.
      - name: Test ProxyCore
        run: |
          xcodebuild test \
            -workspace Nothering.xcworkspace \
            -scheme ProxyCore \
            -configuration Debug \
            -destination 'platform=macOS' \
            $BUILD_FLAGS

      - name: Test PhoneLink
        run: |
          xcodebuild test \
            -workspace Nothering.xcworkspace \
            -scheme PhoneLink \
            -configuration Debug \
            -destination 'platform=macOS' \
            $BUILD_FLAGS
